<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理画面</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell admin-shell"><div class="topbar"><h1>年末調整 管理画面</h1><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div class="row"><button id="newStaff" class="btn">スタッフ登録</button><button id="csvStaff" class="btn secondary">CSV一括登録</button></div>
<div id="register" class="hidden"><h2>スタッフ登録</h2><form id="staffForm"><div class="field"><label>スタッフID（4桁）</label><input id="staffId" pattern="\d{4}" required></div><div class="field"><label>氏名</label><input id="name" required></div><div class="field"><label>生年月日</label><input id="dob" type="date" required></div><div class="field"><label>編集期限</label><input id="deadline" type="datetime-local" required></div><button class="btn">登録</button></form></div>
<div id="csvRegister" class="hidden"><h2>CSV一括登録</h2><p class="muted">CSV列は <strong>staff_id, display_name, birth_date, editable_until</strong> の順です。スタッフIDは4桁、生年月日は YYYY-MM-DD、編集期限は YYYY-MM-DD HH:mm または ISO形式で入力してください。</p><p class="muted">ExcelでスタッフIDの先頭の0が消えないよう、ID列は文字列として扱ってください。</p><div class="row"><button id="downloadTemplate" type="button" class="btn secondary">CSVひな形をダウンロード</button></div><div class="field"><label>CSVファイル</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><div id="csvError" class="error"></div><div id="csvSuccess" class="success"></div><button id="importCsv" type="button" class="btn">CSVを登録</button></div>
<h2>スタッフ一覧</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>氏名</th><th>状態</th><th>PW</th><th>編集期限</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module" src="../assets/js/admin.js"></script></body></html>
