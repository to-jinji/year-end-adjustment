<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者ログイン</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><section class="card"><h1>管理者ログイン</h1><p class="muted">管理者専用ページです。ログイン後に認証アプリによる2段階認証を行います。</p><form id="form"><div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><div id="error" class="error"></div><button id="loginButton" class="btn">ログイン</button></form><div id="mfaEnroll" class="hidden"><h2>2段階認証の初期設定</h2><p>認証アプリ（Google Authenticator、Microsoft Authenticator等）でQRコードを読み取り、表示された6桁コードを入力してください。</p><div style="text-align:center;margin:20px 0"><img id="mfaQr" alt="2段階認証QRコード" style="max-width:260px;width:100%;background:#fff;padding:8px;border-radius:8px"></div><div class="field"><label>QRコードを読み取れない場合の設定キー</label><input id="mfaSecret" readonly></div><form id="mfaEnrollForm"><div class="field"><label>認証コード（6桁）</label><input id="mfaEnrollCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required></div><div id="mfaEnrollError" class="error"></div><button id="mfaEnrollButton" class="btn" type="submit">設定を完了</button></form></div><div id="mfaChallenge" class="hidden"><h2>2段階認証</h2><p class="muted">認証アプリに表示されている6桁コードを入力してください。</p><form id="mfaChallengeForm"><div class="field"><label>認証コード（6桁）</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required></div><div id="mfaError" class="error"></div><button id="mfaButton" class="btn" type="submit">認証して管理画面へ</button></form></div></section></main><script type="module" src="../assets/js/admin-login.js"></script></body></html>
