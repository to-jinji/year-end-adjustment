<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフ回答修正 | 年末調整</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell admin-shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 管理画面</a><h1>スタッフ回答修正</h1><p id="staffMeta" class="muted"></p></div><button id="logout" class="btn secondary">ログアウト</button></div><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><section class="card"><div class="notice">管理者が保存した修正は履歴に記録され、スタッフ画面にも「管理者による修正」として表示されます。</div>
<section class="admin-edit-section"><h2>基本情報</h2><form id="basicForm" class="admin-edit-grid"><div class="field"><label>フリガナ</label><input id="nameKana"></div><div class="field"><label>郵便番号</label><input id="postalCode"></div><div class="field"><label>住所</label><textarea id="address" rows="2"></textarea></div><div class="field"><label>世帯主氏名</label><input id="householdHeadName"></div><div class="field"><label>続柄</label><input id="relationship"></div><div class="field"><button class="btn" type="submit">基本情報を保存</button></div></form></section>
<section class="admin-edit-section"><h2>本人・所得情報</h2><form id="incomeForm" class="admin-edit-grid"><div class="field"><label>他社給与見込額</label><input id="otherSalaryIncome" type="number" min="0"></div><div class="field"><label>給与以外の所得見込額</label><input id="otherIncome" type="number" min="0"></div><div class="field"><label>障害者区分</label><select id="selfDisability"><option>なし</option><option>一般障害者</option><option>特別障害者</option></select></div><div class="field"><label>寡婦・ひとり親</label><select id="widowSingleParent"><option>なし</option><option>寡婦</option><option>ひとり親</option></select></div><div class="field"><label class="inline-check"><input id="workingStudent" type="checkbox">勤労学生</label></div><div class="field"><label>備考</label><textarea id="incomeNote" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">本人・所得情報を保存</button></div></form></section>
<section class="admin-edit-section"><h2>配偶者</h2><form id="spouseForm" class="admin-edit-grid"><div class="field"><label>配偶者</label><select id="hasSpouse"><option value="no">なし</option><option value="yes">あり</option></select></div><div class="field"><label>氏名</label><input id="spouseName"></div><div class="field"><label>フリガナ</label><input id="spouseKana"></div><div class="field"><label>生年月日</label><input id="spouseBirth" type="date"></div><div class="field"><label>所得見込額</label><input id="spouseIncome" type="number" min="0"></div><div class="field"><label class="inline-check"><input id="spouseLiving" type="checkbox">同居</label><label class="inline-check"><input id="spouseNonresident" type="checkbox">非居住者</label></div><div class="field"><label>別居住所</label><textarea id="spouseAddress" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">配偶者情報を保存</button></div></form></section>
<section class="admin-edit-section"><h2>扶養親族</h2><div id="dependentsList" class="edit-records"></div><form id="dependentForm" class="admin-edit-grid"><input id="dependentId" type="hidden"><div class="field"><label>氏名</label><input id="depName"></div><div class="field"><label>フリガナ</label><input id="depKana"></div><div class="field"><label>生年月日</label><input id="depBirth" type="date"></div><div class="field"><label>続柄</label><input id="depRelationship"></div><div class="field"><label>所得見込額</label><input id="depIncome" type="number" min="0"></div><div class="field"><label>障害者区分</label><select id="depDisability"><option>なし</option><option>一般障害者</option><option>特別障害者</option></select></div><div class="field"><label class="inline-check"><input id="depLiving" type="checkbox">同居</label><label class="inline-check"><input id="depNonresident" type="checkbox">非居住者</label></div><div class="field"><label>別居住所</label><textarea id="depAddress" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">扶養親族を保存</button> <button id="clearDependent" class="btn secondary" type="button">入力をクリア</button></div></form></section>
<section class="admin-edit-section"><h2>保険料控除</h2><p class="muted">生命保険料控除は区分・金額の誤入力が起きやすいため、控除証明書と照合して修正してください。</p><div id="insuranceList" class="edit-records"></div><form id="insuranceForm" class="admin-edit-grid"><input id="insuranceId" type="hidden"><div class="field"><label>種類</label><select id="insuranceType"><option>新生命保険料（一般）</option><option>旧生命保険料（一般）</option><option>介護医療保険料</option><option>新個人年金保険料</option><option>旧個人年金保険料</option><option>地震保険料</option><option>旧長期損害保険料</option><option>社会保険料</option><option>小規模企業共済等掛金</option></select></div><div class="field"><label>保険会社・支払先</label><input id="companyName"></div><div class="field"><label>契約者・支払者</label><input id="policyholderName"></div><div class="field"><label>受取人</label><input id="beneficiaryName"></div><div class="field"><label>支払額</label><input id="paidAmount" type="number" min="0"></div><div class="field"><label>備考</label><textarea id="insuranceNote" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">保険情報を保存</button> <button id="clearInsurance" class="btn secondary" type="button">入力をクリア</button></div></form></section>
<section class="admin-edit-section"><h2>前職</h2><div class="field"><label>前職の有無</label><select id="hasPrevious"><option value="no">なし</option><option value="yes">あり</option></select><button id="savePreviousSummary" class="btn secondary" type="button">前職有無を保存</button></div><div id="previousList" class="edit-records"></div><form id="previousForm" class="admin-edit-grid"><input id="previousId" type="hidden"><div class="field"><label>勤務先名</label><input id="employerName"></div><div class="field"><label>退職日</label><input id="retirementDate" type="date"></div><div class="field"><label>支払金額</label><input id="paymentAmount" type="number" min="0"></div><div class="field"><label>源泉徴収税額</label><input id="withholdingTax" type="number" min="0"></div><div class="field"><label>社会保険料等</label><input id="socialInsurance" type="number" min="0"></div><div class="field"><label>備考</label><textarea id="previousNote" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">前職情報を保存</button> <button id="clearPrevious" class="btn secondary" type="button">入力をクリア</button></div></form></section>
<section class="admin-edit-section"><h2>住宅ローン控除</h2><form id="housingForm" class="admin-edit-grid"><div class="field"><label>住宅ローン控除</label><select id="hasHousingLoan"><option value="no">なし</option><option value="yes">あり</option></select></div><div class="field"><label class="inline-check"><input id="firstYear" type="checkbox">初年度</label></div><div class="field"><label>居住開始日</label><input id="moveInDate" type="date"></div><div class="field"><label>年末残高</label><input id="yearEndBalance" type="number" min="0"></div><div class="field"><label>連帯債務割合</label><input id="jointDebtRatio" type="number" min="0" max="100" step="0.01"></div><div class="field"><label>住宅借入金等特別控除額</label><input id="deductionAmount" type="number" min="0"></div><div class="field"><label>備考</label><textarea id="housingNote" rows="2"></textarea></div><div class="field"><button class="btn" type="submit">住宅ローン情報を保存</button></div></form></section>

<section class="admin-edit-section"><h2>添付書類</h2><p class="muted">スタッフがアップロードした必要書類を確認できます。表示用URLは短時間で失効します。</p><div class="table-wrap"><table><thead><tr><th>種類</th><th>ファイル名</th><th>アップロード日時</th><th>確認</th></tr></thead><tbody id="adminDocumentsBody"><tr><td colspan="4" class="muted">読み込み中…</td></tr></tbody></table></div></section>
</section></main><script type="module" src="../assets/js/admin-staff-edit.js"></script></body></html>
