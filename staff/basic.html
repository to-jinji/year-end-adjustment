<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基本情報 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>基本情報</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><form id="basicForm"><div class="field"><label>氏名</label><input id="displayName" readonly></div><div class="field"><label>生年月日</label><input id="birthDate" readonly></div><div class="field"><label for="nameKana">フリガナ</label><input id="nameKana" autocomplete="name" placeholder="ヤマダ タロウ" required></div><div class="field"><label for="postalCode">郵便番号</label><input id="postalCode" inputmode="numeric" autocomplete="postal-code" placeholder="1234567" maxlength="8" required><p class="field-help">ハイフンあり・なしのどちらでも入力できます。</p></div><div class="field"><label for="address">住所</label><textarea id="address" rows="3" autocomplete="street-address" required></textarea></div><div class="field"><label for="householdHeadName">世帯主の氏名</label><input id="householdHeadName" required></div><div class="field"><label for="relationship">あなたとの続柄</label><input id="relationship" placeholder="本人、夫、妻、父 など" required></div><div class="row"><button id="saveBasic" class="btn" type="submit">保存</button><a class="btn secondary" href="./index.html">戻る</a></div></form><div id="lockedMessage" class="notice hidden">編集期限を過ぎているか、現在の状態では編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-basic.js"></script></body></html>
