<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基本情報 | 年末調整</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css?v=0.9.10"><style>body.page-loading{overflow:hidden}.page-loading-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f5f7fa;color:#334155;font-weight:700}.page-loading .shell{visibility:hidden}.loading-spinner{width:38px;height:38px;border:4px solid #dbe3ee;border-top-color:#111827;border-radius:50%;animation:page-spin .8s linear infinite}@keyframes page-spin{to{transform:rotate(360deg)}}</style></head><body class="page-loading"><div id="pageLoading" class="page-loading-overlay" role="status" aria-live="polite"><div class="loading-spinner" aria-hidden="true"></div><div>基本情報を読み込んでいます…</div></div><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>基本情報</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><div class="field-legend"><span class="field-badge required">必須</span><span>入力が必要</span><span class="field-badge optional">任意</span><span>該当する場合のみ</span></div><form id="basicForm"><div class="field"><label>氏名</label><input id="displayName" readonly></div><div class="field"><label>生年月日</label><input id="birthDate" readonly></div><div class="field"><label for="nameKana">フリガナ <span class="field-badge required">必須</span></label><input id="nameKana" autocomplete="name" placeholder="ヤマダ タロウ" required></div><div class="field"><label for="postalCode">郵便番号 <span class="field-badge required">必須</span></label><div class="input-action"><input id="postalCode" inputmode="numeric" autocomplete="postal-code" placeholder="1234567" maxlength="8" required><button id="lookupPostal" class="btn secondary" type="button" data-edit-action>郵便番号から住所を検索</button></div><p class="field-help">7桁入力すると自動検索します。自動取得できない場合は住所を手入力できます。</p></div><div class="field"><label for="address">住所 <span class="field-badge required">必須</span></label><textarea id="address" rows="3" autocomplete="street-address" placeholder="都道府県・市区町村・町名・番地・建物名" required></textarea></div><div class="field"><label for="householdHeadName">世帯主の氏名 <span class="field-badge required">必須</span></label><input id="householdHeadName" required></div><div class="field"><label for="relationship">あなたとの続柄 <span class="field-badge required">必須</span></label><input id="relationship" placeholder="本人、夫、妻、父 など" required></div><div class="row"><button id="saveBasic" class="btn" type="submit">保存</button><a class="btn secondary" href="./index.html">戻る</a></div></form><div id="lockedMessage" class="notice hidden">編集期限を過ぎているか、現在の状態では編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-basic.js?v=0.9.10"></script></body></html>
