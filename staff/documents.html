<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>必要書類 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>必要書類</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><p class="muted">必要な証明書をPDFまたは画像でアップロードしてください。1ファイル10MBまでです。</p><div class="table-wrap"><table><thead><tr><th>種類</th><th>ファイル名</th><th>登録日時</th><th></th></tr></thead><tbody id="documentsBody"></tbody></table></div><form id="uploadForm" class="subcard"><div class="field"><label for="documentCategory">書類の種類</label><select id="documentCategory"><option>前職の源泉徴収票</option><option>生命保険料控除証明書</option><option>地震保険料控除証明書</option><option>社会保険料控除関係書類</option><option>小規模企業共済等掛金払込証明書</option><option>住宅借入金等特別控除関係書類</option><option>その他</option></select></div><div class="field"><label for="documentFile">ファイル</label><input id="documentFile" type="file" accept="application/pdf,image/*"></div><button class="btn secondary" type="submit">アップロード</button></form><div class="row form-footer"><button id="completeDocuments" class="btn" type="button">必要書類の確認を完了</button><a class="btn secondary" href="./index.html">戻る</a></div><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-documents.js"></script></body></html>
