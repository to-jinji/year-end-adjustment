<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扶養控除等申告書 | 年末調整</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css?v=0.12.0">
<style>
.declaration-intro{margin-bottom:18px}
.declaration-section{margin:18px 0;padding-top:18px;border-top:1px solid #dbe3ee}
.declaration-section:first-of-type{border-top:0;padding-top:0}
.declaration-section h2{margin:0 0 12px;font-size:1.15rem}
.declaration-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dependent-declaration-card{border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin:10px 0;background:#fff}
.dependent-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dependent-card-head strong{font-size:1rem}
.declaration-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.declaration-readonly{background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:16px}
.confirmed-info{font-size:.9rem;color:#64748b}
@media(max-width:640px){.declaration-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="page-loading">
<div id="pageLoading" class="page-loading-overlay" role="status" aria-live="polite">
  <div class="loading-spinner" aria-hidden="true"></div>
  <div>扶養控除等申告書を読み込んでいます…</div>
</div>
<main class="shell">
  <div class="topbar">
    <div><h1>2026年 扶養控除等申告書</h1></div>
    <button id="logout" class="btn secondary" type="button">ログアウト</button>
  </div>
  <section class="card">
    <div id="pageError" class="error"></div>
    <div id="readonlyNotice" class="declaration-readonly hidden">
      提出済みの内容を表示しています。修正する場合は年末調整TOPから「内容を修正する」を開始してください。
    </div>
    <div class="notice declaration-intro">
      令和8年分「給与所得者の扶養控除等（異動）申告書」の内容です。<br>
      ここで入力した内容は「基本情報」「本人・所得情報」「配偶者・扶養」に自動反映されます。
      すでに回答済みの内容は自動で表示されます。個人番号はこのサイトでは収集しません。
    </div>
    <p id="confirmedInfo" class="confirmed-info"></p>

    <form id="declarationForm">
      <section class="declaration-section">
        <h2>本人情報</h2>
        <div class="declaration-grid">
          <div class="field"><label>氏名</label><input id="displayName" readonly></div>
          <div class="field"><label>生年月日</label><input id="birthDate" readonly></div>
          <div class="field"><label>フリガナ <span class="field-badge required">必須</span></label><input id="nameKana"></div>
          <div class="field"><label>郵便番号 <span class="field-badge required">必須</span></label><input id="postalCode" inputmode="numeric" maxlength="7" placeholder="8120013"></div>
        </div>
        <div class="field"><label>住所 <span class="field-badge required">必須</span></label><input id="address"></div>
        <div class="declaration-grid">
          <div class="field"><label>世帯主の氏名 <span class="field-badge required">必須</span></label><input id="householdHeadName"></div>
          <div class="field"><label>あなたとの続柄 <span class="field-badge required">必須</span></label><input id="relationship"></div>
        </div>
      </section>

      <section class="declaration-section">
        <h2>本人の申告事項</h2>
        <div class="declaration-grid">
          <div class="field"><label>障害者区分</label><select id="selfDisability"><option>なし</option><option>一般障害者</option><option>特別障害者</option></select></div>
          <div class="field"><label>寡婦・ひとり親</label><select id="widowSingleParent"><option>なし</option><option>寡婦</option><option>ひとり親</option></select></div>
        </div>
        <label class="inline-check"><input id="workingStudent" type="checkbox"> 勤労学生に該当する</label>
        <label class="inline-check"><input id="secondaryDependentDeclarationSubmitted" type="checkbox"> 従たる給与についての扶養控除等（異動）申告書を提出している</label>
        <div class="field"><label>障害者または勤労学生の内容 <span class="field-badge optional">該当する場合</span></label><textarea id="disabilityStudentDetail" rows="2"></textarea></div>
      </section>

      <section class="declaration-section">
        <h2>配偶者</h2>
        <div class="field"><label>配偶者の有無</label><select id="hasSpouse"><option value="no">なし</option><option value="yes">あり</option></select></div>
        <div id="spouseFields" class="subcard hidden">
          <div class="declaration-grid">
            <div class="field"><label>氏名 <span class="field-badge required">必須</span></label><input id="spouseName"></div>
            <div class="field"><label>フリガナ</label><input id="spouseKana"></div>
            <div class="field"><label>生年月日 <span class="field-badge required">必須</span></label><input id="spouseBirth" type="date"></div>
            <div class="field"><label>所得見積額（円）</label><input id="spouseIncome" type="text" inputmode="numeric"></div>
          </div>
          <label class="inline-check"><input id="spouseLiving" type="checkbox" checked> 同居している</label>
          <label class="inline-check"><input id="spouseNonresident" type="checkbox"> 非居住者に該当する</label>
          <div class="field"><label>別居の場合の住所</label><textarea id="spouseAddress" rows="2"></textarea></div>
          <div id="spouseNonresidentFields" class="hidden">
            <div class="field"><label>生計を一にする事実（送金額等・円）</label><input id="spouseLivelihoodSupport" type="text" inputmode="numeric"></div>
          </div>
          <div class="declaration-grid">
            <div class="field"><label>異動年月日</label><input id="spouseChangeDate" type="date"></div>
            <div class="field"><label>異動事由</label><input id="spouseChangeReason"></div>
          </div>
          <label class="inline-check"><input id="spouseHasRetirementIncome" type="checkbox"> 令和8年中に退職手当等を有する</label>
          <div id="spouseRetirementFields" class="field hidden"><label>退職所得を除く所得見積額（円）</label><input id="spouseRetirementIncome" type="text" inputmode="numeric"></div>
        </div>
      </section>

      <section class="declaration-section">
        <div class="dependent-card-head"><h2 style="margin:0">扶養親族</h2><button id="addDependent" class="btn secondary tiny" type="button">扶養親族を追加</button></div>
        <div id="dependentsContainer"></div>
      </section>

      <div class="declaration-actions">
        <button id="saveDeclaration" class="btn" type="submit">保存して年末調整へ</button>
        <a class="btn secondary" href="./index.html">年末調整TOPへ</a>
      </div>
    </form>
  </section>
</main>
<script type="module" src="../assets/js/staff-fuyou-declaration.js?v=0.12.0"></script>
</body>
</html>
