<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住宅ローン控除 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>住宅ローン控除</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><div class="field-legend"><span class="field-badge required">必須</span><span>入力が必要</span><span class="field-badge optional">任意</span><span>該当する場合のみ</span></div><form id="housingForm"><div class="field"><label for="hasHousingLoan">住宅借入金等特別控除に関する手続きがありますか？ <span class="field-badge required">必須</span></label><select id="hasHousingLoan"><option value="no">いいえ</option><option value="yes">はい</option></select></div><div id="housingFields" class="subcard hidden"><div class="conditional-box">「はい」の場合のみ、以下の項目と関係書類の添付が必要です。</div><label class="inline-check"><input id="firstYear" type="checkbox"> 住宅ローン控除を受ける最初の年です</label><p class="field-help">初年度の場合は必要な手続きが異なることがあるため、管理者へ確認してください。</p><div class="field-grid"><div class="field"><label for="moveInDate">居住開始日 <span class="field-badge required">必須</span></label><input id="moveInDate" type="date"></div><div class="field"><label for="yearEndBalance">年末残高（円） <span class="field-badge required">必須</span></label><input id="yearEndBalance" type="text" inputmode="numeric" placeholder="例：18,500,000"></div><div class="field"><label for="jointDebtRatio">連帯債務割合（%） <span class="field-badge optional">任意</span></label><input id="jointDebtRatio" type="number" min="0" max="100" step="0.01"></div><div class="field"><label for="deductionAmount">住宅借入金等特別控除額（円） <span class="field-badge required">必須</span></label><input id="deductionAmount" type="text" inputmode="numeric" placeholder="例：120,000"><p class="field-help">年末調整用の住宅借入金等特別控除申告書・控除証明書等に記載された控除額を入力してください。</p></div></div><div class="field"><label for="housingNote">備考 <span class="field-badge optional">任意</span></label><textarea id="housingNote" rows="3"></textarea></div><p class="field-help">控除証明書や年末残高証明書などは「必要書類」からアップロードしてください。</p></div><div class="row form-footer"><button class="btn" type="submit">保存して完了</button><a class="btn secondary" href="./index.html">戻る</a></div></form><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-housing.js"></script></body></html>
