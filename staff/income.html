<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本人・所得情報 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>本人・所得情報</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><form id="incomeForm"><p class="muted">TO株式会社の給与以外の2026年分の所得見込みや、本人に該当する控除区分を入力してください。</p><div class="field"><label for="otherSalaryIncome">TO株式会社以外から受け取る給与の見込額（円）</label><input id="otherSalaryIncome" type="number" min="0" step="1" value="0"></div><div class="field"><label for="otherIncome">給与以外の所得の見込額（円）</label><input id="otherIncome" type="number" min="0" step="1" value="0"><p class="field-help">事業・雑・配当・不動産など、給与以外の所得がある場合に入力してください。</p></div><div class="field-grid"><div class="field"><label for="selfDisability">本人の障害者区分</label><select id="selfDisability"><option>なし</option><option>一般障害者</option><option>特別障害者</option></select></div><div class="field"><label for="widowSingleParent">寡婦・ひとり親</label><select id="widowSingleParent"><option>なし</option><option>寡婦</option><option>ひとり親</option></select></div></div><label class="inline-check"><input id="workingStudent" type="checkbox"> 勤労学生に該当する</label><div class="field"><label for="incomeNote">備考</label><textarea id="incomeNote" rows="3"></textarea></div><div class="row form-footer"><button class="btn" type="submit">保存して完了</button><a class="btn secondary" href="./index.html">戻る</a></div></form><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-income.js"></script></body></html>
