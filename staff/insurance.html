<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保険料控除 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>保険料控除</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><div class="field-legend"><span class="field-badge required">必須</span><span>入力が必要</span><span class="field-badge optional">任意</span><span>該当する場合のみ</span></div><p class="muted">保険料控除がある場合だけ登録してください。該当がない場合は登録0件のまま「入力完了」にできます。</p><div class="not-applicable-box">保険料控除がない場合：この画面の入力項目は対象外です。</div><div class="table-wrap"><table><thead><tr><th>種類</th><th>保険会社等</th><th>契約者</th><th>支払額</th><th></th></tr></thead><tbody id="insuranceBody"></tbody></table></div><form id="insuranceForm" class="subcard"><h3>保険料を追加</h3><div class="field-grid"><div class="field"><label for="insuranceType">種類 <span class="field-badge required">必須</span></label><select id="insuranceType"><option value="新生命保険料（一般）">新生命保険料（一般）</option><option value="旧生命保険料（一般）">旧生命保険料（一般）</option><option value="介護医療保険料">介護医療保険料</option><option value="新個人年金保険料">新個人年金保険料</option><option value="旧個人年金保険料">旧個人年金保険料</option><option value="地震保険料">地震保険料</option><option value="旧長期損害保険料">旧長期損害保険料</option><option value="社会保険料">社会保険料</option><option value="小規模企業共済等掛金">小規模企業共済等掛金</option></select></div><div class="field"><label for="companyName">保険会社・支払先 <span class="field-badge required">必須</span></label><input id="companyName"></div><div class="field"><label for="policyholderName">契約者・支払者 <span class="field-badge required">必須</span></label><input id="policyholderName"></div><div class="field"><label for="beneficiaryName">受取人 <span class="field-badge optional">任意</span></label><input id="beneficiaryName"></div><div class="field"><label for="paidAmount">2026年中の支払額（円） <span class="field-badge required">必須</span></label><input id="paidAmount" type="number" min="0" step="1"></div></div><div class="field"><label for="insuranceNote">備考 <span class="field-badge optional">任意</span></label><textarea id="insuranceNote" rows="2"></textarea></div><button class="btn secondary" type="submit">追加</button></form><div class="row form-footer"><button id="completeInsurance" class="btn" type="button">この内容で入力完了</button><a class="btn secondary" href="./index.html">戻る</a></div><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-insurance.js"></script></body></html>
