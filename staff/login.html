<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフログイン</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><section class="card"><h1>スタッフ本人確認</h1><p class="muted">スタッフIDと生年月日を入力してください。</p><form id="verifyForm"><div class="field"><label>スタッフID（4桁）</label><input id="staffId" inputmode="numeric" maxlength="4" pattern="\d{4}" required placeholder="0123"></div><div class="field"><label>生年月日（8桁）</label><input id="birthDate" inputmode="numeric" maxlength="8" pattern="\d{8}" required placeholder="19950418"></div><div id="error" class="error"></div><button class="btn" type="submit">次へ</button></form><div id="passwordPanel" class="hidden"><h2 id="passwordTitle"></h2><form id="passwordForm"><div class="field"><label id="passwordLabel">パスワード</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><div id="confirmField" class="field hidden"><label>パスワード（確認）</label><input id="passwordConfirm" type="password" minlength="8" autocomplete="new-password"></div><div id="passwordError" class="error"></div><button id="passwordSubmit" class="btn" type="submit"></button></form></div></section></main><script type="module" src="../assets/js/staff-login.js"></script></body></html>
