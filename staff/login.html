<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフログイン</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css?v=0.9.12"></head><body><main class="shell"><section class="card"><h1>スタッフ本人確認</h1><p class="muted">社員番号と生年月日を入力してください。</p><div class="notice">本人確認に5回失敗すると、その社員番号は24時間ロックされます。</div><form id="verifyForm"><div class="field"><label>社員番号（4桁）</label><input id="staffId" inputmode="numeric" maxlength="4" pattern="\d{4}" required placeholder="0123"></div><div class="field"><label>生年月日（8桁）</label><input id="birthDate" inputmode="numeric" maxlength="8" pattern="\d{8}" required placeholder="19950418"></div><div id="error" class="error"></div><button class="btn" type="submit">次へ</button></form><div id="passwordPanel" class="hidden"><h2 id="passwordTitle"></h2><form id="passwordForm"><div class="field"><label id="passwordLabel">パスワード</label><div class="password-input-wrap"><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="password-eye" type="button" data-password-toggle="password" aria-label="パスワードを表示" title="パスワードを表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><p id="passwordHint" class="muted hidden">8文字以上で、英字と数字をそれぞれ1文字以上含めてください。</p></div><div id="confirmField" class="field hidden"><label>パスワード（確認）</label><div class="password-input-wrap"><input id="passwordConfirm" type="password" minlength="8" autocomplete="new-password"><button class="password-eye" type="button" data-password-toggle="passwordConfirm" aria-label="パスワードを表示" title="パスワードを表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div id="passwordError" class="error"></div><button id="passwordSubmit" class="btn" type="submit"></button></form></div></section></main><script type="module" src="../assets/js/staff-login.js?v=0.9.12"></script></body></html>
