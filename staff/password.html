<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード変更</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css?v=0.9.12"></head><body><main class="shell"><div class="topbar"><div><a href="./index.html">← 年末調整トップ</a><h1>パスワード変更</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="requiredNotice" class="notice hidden"><strong>仮パスワードでログインしています。</strong><br>今後使用する任意のパスワードへ変更してください。</div><p class="muted">8文字以上で、英字と数字をそれぞれ1文字以上含めてください。</p><form id="passwordChangeForm"><div class="field"><label>新しいパスワード</label><div class="password-input-wrap"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-password-toggle="newPassword" aria-label="パスワードを表示" title="パスワードを表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div class="field"><label>パスワード（確認）</label><div class="password-input-wrap"><input id="newPasswordConfirm" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-password-toggle="newPasswordConfirm" aria-label="パスワードを表示" title="パスワードを表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div id="passwordChangeError" class="error"></div><div id="passwordChangeSuccess" class="notice hidden"></div><button id="passwordChangeSubmit" class="btn" type="submit">パスワードを変更</button></form></section></main><script type="module" src="../assets/js/staff-password.js?v=0.9.12"></script></body></html>
