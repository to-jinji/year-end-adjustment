<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前職・源泉徴収票 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>前職・源泉徴収票</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><div class="field-legend"><span class="field-badge required">必須</span><span>入力が必要</span><span class="field-badge optional">任意</span><span>該当する場合のみ</span></div><div class="field"><label for="hasPrevious">2026年中にTO株式会社へ入社する前、他社から給与の支払いを受けましたか？ <span class="field-badge required">必須</span></label><select id="hasPrevious"><option value="no">いいえ</option><option value="yes">はい</option></select></div><div id="previousFields" class="hidden"><div class="conditional-box">「はい」の場合のみ、以下の項目と源泉徴収票の添付が必須です。</div><p class="muted">源泉徴収票の内容を勤務先ごとに登録してください。源泉徴収票の画像・PDFは「必要書類」からアップロードできます。</p><div class="table-wrap"><table><thead><tr><th>勤務先</th><th>退職日</th><th>支払金額</th><th>源泉徴収税額</th><th></th></tr></thead><tbody id="previousBody"></tbody></table></div><form id="previousEntryForm" class="subcard"><h3>前職を追加</h3><div class="field-grid"><div class="field"><label for="employerName">勤務先名 <span class="field-badge required">必須</span></label><input id="employerName"></div><div class="field"><label for="retirementDate">退職日 <span class="field-badge optional">任意</span></label><input id="retirementDate" type="date"></div><div class="field"><label for="paymentAmount">支払金額（円） <span class="field-badge required">必須</span></label><input id="paymentAmount" type="number" min="0" step="1"></div><div class="field"><label for="withholdingTax">源泉徴収税額（円） <span class="field-badge required">必須</span></label><input id="withholdingTax" type="number" min="0" step="1"></div><div class="field"><label for="socialInsurance">社会保険料等の金額（円） <span class="field-badge required">必須</span></label><input id="socialInsurance" type="number" min="0" step="1"></div></div><div class="field"><label for="previousNote">備考 <span class="field-badge optional">任意</span></label><textarea id="previousNote" rows="2"></textarea></div><button class="btn secondary" type="submit">追加</button></form></div><div class="row form-footer"><button id="savePrevious" class="btn" type="button">この内容を保存して完了</button><a class="btn secondary" href="./index.html">戻る</a></div><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-previous.js"></script></body></html>
