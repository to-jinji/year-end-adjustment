<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>確認・提出 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>入力内容の確認・提出</h1><span id="status" class="badge">確認中</span></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><h2>入力内容</h2><div id="summary"></div>
<div id="submittedNotice" class="notice hidden">提出済みです。内容を修正したい場合は「修正依頼を送る」から管理者へ申請してください。承認されると再編集できるようになります。</div>
<div id="editingNotice" class="notice hidden">修正依頼が承認されています。必要な項目を修正し、完了後にこの画面から再提出してください。</div>
<div id="correctionArea" class="hidden" style="margin-top:18px"><button id="openCorrectionRequest" type="button" class="btn secondary">修正依頼を送る</button><div id="correctionForm" class="subcard hidden" style="margin-top:14px"><h3>修正依頼</h3><div class="field"><label for="correctionSection">修正したい項目 <span class="required-mark">必須</span></label><select id="correctionSection"><option value="">選択してください</option><option value="basic">基本情報</option><option value="income">本人・所得情報</option><option value="spouse_dependents">配偶者・扶養</option><option value="insurance">保険料控除</option><option value="previous_employment">前職・源泉徴収票</option><option value="housing_loan">住宅ローン控除</option><option value="documents">必要書類</option><option value="other">その他</option></select></div><div class="field"><label for="correctionCurrent">現在の内容 <span class="required-mark">必須</span></label><textarea id="correctionCurrent" rows="4" maxlength="2000" placeholder="現在登録されている内容を入力してください"></textarea></div><div class="field"><label for="correctionRequested">修正後の内容 <span class="required-mark">必須</span></label><textarea id="correctionRequested" rows="4" maxlength="2000" placeholder="どのように修正したいか入力してください"></textarea></div><div id="correctionError" class="error"></div><div id="correctionSuccess" class="success"></div><div class="row"><button id="sendCorrectionRequest" type="button" class="btn">修正依頼を送信</button><button id="cancelCorrectionRequest" type="button" class="btn secondary">キャンセル</button></div></div></div>
<div id="correctionHistoryWrap" class="hidden" style="margin-top:22px"><h3>修正依頼の履歴</h3><div id="correctionHistory"></div></div>
<p id="submitHint" class="muted"></p><div class="row form-footer"><button id="submitBtn" class="btn">年末調整を提出する</button><a class="btn secondary" href="./index.html">戻る</a></div></section></main><script type="module" src="../assets/js/staff-review.js"></script></body></html>
