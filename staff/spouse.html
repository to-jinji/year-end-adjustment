<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配偶者・扶養 | 年末調整</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="shell"><div class="topbar"><div><a class="back-link" href="./index.html">← 年末調整トップ</a><h1>配偶者・扶養</h1></div><button id="logout" class="btn secondary">ログアウト</button></div><section class="card"><div id="pageError" class="error"></div><div id="pageSuccess" class="success"></div><p id="deadline" class="muted"></p><div class="field-legend"><span class="field-badge required">必須</span><span>入力が必要</span><span class="field-badge optional">任意</span><span>該当する場合のみ</span></div><div id="spouseForm"><h2>配偶者</h2><div class="field"><label for="hasSpouse">配偶者の有無 <span class="field-badge required">必須</span></label><select id="hasSpouse"><option value="no">なし</option><option value="yes">あり</option></select></div><div id="spouseFields" class="subcard hidden"><div class="field-grid"><div class="field"><label for="spouseName">氏名 <span class="field-badge required">必須</span></label><input id="spouseName"></div><div class="field"><label for="spouseKana">フリガナ <span class="field-badge optional">任意</span></label><input id="spouseKana"></div><div class="field"><label for="spouseBirth">生年月日 <span class="field-badge required">必須</span></label><input id="spouseBirth" type="date"></div><div class="field"><label for="spouseIncome">2026年の所得見込額（円） <span class="field-badge required">必須</span></label><input id="spouseIncome" type="number" min="0" step="1"></div></div><label class="inline-check"><input id="spouseLiving" type="checkbox" checked> 同居している</label><label class="inline-check"><input id="spouseNonresident" type="checkbox"> 非居住者に該当する</label><div class="field"><label for="spouseAddress">別居の場合の住所 <span class="field-badge optional">別居時</span></label><textarea id="spouseAddress" rows="2"></textarea></div></div><hr class="section-rule"><h2>扶養親族 <span class="field-badge optional">該当する場合</span></h2><p class="muted">該当する方を1人ずつ追加してください。16歳未満の扶養親族も登録できます。</p><div class="table-wrap"><table><thead><tr><th>氏名</th><th>続柄</th><th>生年月日</th><th>所得見込</th><th></th></tr></thead><tbody id="dependentsBody"></tbody></table></div><div class="subcard"><h3>扶養親族を追加</h3><form id="addDependentForm"><div class="field-grid"><div class="field"><label for="depName">氏名</label><input id="depName"></div><div class="field"><label for="depKana">フリガナ</label><input id="depKana"></div><div class="field"><label for="depBirth">生年月日</label><input id="depBirth" type="date"></div><div class="field"><label for="depRelationship">続柄</label><input id="depRelationship" placeholder="子、父、母 など"></div><div class="field"><label for="depIncome">2026年の所得見込額（円）</label><input id="depIncome" type="number" min="0" step="1"></div><div class="field"><label for="depDisability">障害者区分</label><select id="depDisability"><option>なし</option><option>一般障害者</option><option>特別障害者</option></select></div></div><label class="inline-check"><input id="depLiving" type="checkbox" checked> 同居している</label><label class="inline-check"><input id="depNonresident" type="checkbox"> 非居住者に該当する</label><div class="field"><label for="depAddress">別居の場合の住所</label><textarea id="depAddress" rows="2"></textarea></div><button class="btn secondary" type="submit">追加</button></form></div><div class="row form-footer"><button id="saveSpouse" class="btn" type="button">この内容を保存して完了</button><a class="btn secondary" href="./index.html">戻る</a></div></div><div id="lockedMessage" class="notice hidden">現在は編集できません。内容の確認のみできます。</div></section></main><script type="module" src="../assets/js/staff-spouse.js"></script></body></html>
